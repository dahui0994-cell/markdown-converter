name: Docker build check

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "main.py"
      - "renderer.py"
      - "web/**"
      - "assets/**"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "main.py"
      - "renderer.py"
      - "web/**"
      - "assets/**"
  workflow_dispatch:   # 手动触发(改 workflow 本身时 paths 不匹配, 用它补跑)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只构建不推送: 校验 Dockerfile 语法/依赖安装/字体安装是否成功
      - name: Build image
        run: docker build -t md-converter:check .

      # 构建出镜像后冒烟: 起容器, 等 /health 就绪, 打一个含 mermaid 的 PDF。
      # 用 8899 避开 runner 上可能的端口占用; 任何一步失败都先 dump 容器日志便于定位。
      - name: Smoke test container
        env:
          HOST_PORT: "8899"
        run: |
          set -u
          docker run -d -p "$HOST_PORT":8000 --name md-smoke md-converter:check

          dump() {
            echo "=== 容器状态 ==="; docker ps -a --filter name=md-smoke
            echo "=== 容器日志(最后 40 行) ==="; docker logs md-smoke 2>&1 | tail -40 || true
          }

          ok=""
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$HOST_PORT/health" >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then dump; exit 1; fi
          echo "=== health OK, 开始转换冒烟 ==="

          printf '# 冒烟\n\n```mermaid\ngraph LR\nA --> B\n```\n' > /tmp/smoke.md
          if ! curl -fsS -X POST "http://127.0.0.1:$HOST_PORT/api/convert" \
              -F "md=$(cat /tmp/smoke.md)" -F format=pdf -o /tmp/out.pdf; then
            dump; exit 1
          fi
          head -c 4 /tmp/out.pdf | grep -q '%PDF' && echo "=== PDF 冒烟通过 ===" || { dump; exit 1; }

      - name: Teardown
        if: always()
        run: docker rm -f md-smoke || true
